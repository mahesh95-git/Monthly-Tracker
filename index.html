<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Employee Time Tracker</title>

    <!-- Inter font (kept) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>
        /* Reset & base */
        * { box-sizing: border-box; }
        html,body { height:100%; margin:0; font-family: 'Inter', sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
        body { background:#eef3f7; display:flex; align-items:center; justify-content:center; padding:20px; }

        /* Utility */
        .hidden { display:none !important; }
        .text-center { text-align:center; }
        .status { padding:10px 12px; font-size:0.9rem; color:#475569; }
        .status.error { background:#fff1f2; color:#991b1b; border-radius:6px; }

        /* App container */
        #app-container {
            width:100%;
            max-width:920px;
            background:linear-gradient(135deg,#ffffff 50%, #f9fafb 100%);
            border-radius:18px;
            box-shadow:0 10px 30px rgba(20,38,51,0.08);
            padding:28px;
        }

        /* Header */
        h1 { font-size:28px; margin:0 0 18px 0; color:#0f766e; font-weight:800; display:flex; align-items:center; gap:12px; border-bottom:3px solid rgba(15,118,110,0.12); padding-bottom:12px; }
        svg.clock { width:36px; height:36px; color: #0f766e; }

        /* Content area */
        #content { display:block; margin-top:12px; }

        section { border-radius:12px; padding:18px; margin-bottom:18px; box-shadow:0 4px 18px rgba(15,23,42,0.04); border:1px solid rgba(15,23,42,0.04); background:#fff; }

        /* Specific sections */
        .section-blue { background:#f0f9ff; border-color:#dbf4ff; }
        .section-purple { background:#faf5ff; border-color:#f3e8ff; }
        .section-teal { background:#f0fdfa; border-color:#d1fae5; }

        /* Form grid */
        .form-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:12px; }
        @media(min-width:760px){ .form-grid { grid-template-columns: repeat(4,1fr); } }

        label { display:block; margin-bottom:6px; font-size:0.9rem; color:#334155; }
        input[type="date"], input[type="time"], input[type="text"], button {
            width:100%; padding:10px 12px; border-radius:10px; border:1px solid #cbd5e1; font-size:0.96rem;
            background:#fff; color:#0f172a;
        }
        input[type="date"], input[type="time"] { background:#fff; }
        button.primary {
            background:#0ea5a0; color:#fff; border:none; cursor:pointer; font-weight:600; padding:10px 14px;
            box-shadow:0 6px 18px rgba(14,165,160,0.14);
            transition:transform .12s ease, background .12s ease;
            border-radius:10px;
        }
        button.primary:hover { transform:translateY(-2px); background:#08958f; }

        /* Summary grid */
        .summary-grid { display:grid; gap:12px; grid-template-columns:1fr; }
        @media(min-width:760px){ .summary-grid { grid-template-columns:repeat(3,1fr); } }
        .summary-card { padding:14px; border-radius:10px; background:#fff; border:1px solid #e6e6f0; }
        .summary-card.total { background:#f5e9ff; border:2px solid #d8b4fe; }

        .summary-label { font-size:0.86rem; color:#475569; display:block; }
        .summary-value { display:block; margin-top:6px; font-weight:800; font-size:1.2rem; color:#0f766e; }

        /* History table */
        .history-wrapper { max-height:360px; overflow:auto; }
        table { width:100%; border-collapse:collapse; min-width:640px; }
        th, td { padding:12px 10px; border-bottom:1px solid #eef2f7; text-align:left; font-size:0.95rem; color:#0f172a; }
        thead th { background:#e6fffa; color:#065f46; font-weight:700; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.03em; }
        tbody tr:hover { background:#f0fdf4; }
        .time-in { color:#0369a1; font-weight:700; }
        .time-out { color:#b91c1c; font-weight:700; }
        .duration { color:#0f766e; font-weight:800; }

        /* PRINT */
        @media print {
            body { background:#fff; }
            #app-container { box-shadow:none; max-width:100%; border:none; padding:0; }
            /* hide controls */
            #time-form, #generate-report-btn, #status-message { display:none !important; }
            /* show only container content nicely */
            h1::after { content: ""; display:block; margin-bottom:8px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <h1>
            <svg class="clock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
            </svg>
            Monthly Work Tracker
        </h1>

        <div id="status-message" class="status text-center">
            Initializing application...
        </div>

        <div id="content" class="">
            <!-- 1. Time Entry -->
            <section class="section-blue">
                <h2 style="margin:0 0 12px 0; font-size:1.15rem; color:#075985;">Daily Shift Entry</h2>
                <form id="time-form" class="form-grid" style="align-items:end;">
                    <div>
                        <label for="record-date">Date</label>
                        <input type="date" id="record-date" required>
                    </div>
                    <div>
                        <label for="in-time">In-Time (24hr)</label>
                        <input type="time" id="in-time" required>
                    </div>
                    <div>
                        <label for="out-time">Out-Time (24hr)</label>
                        <input type="time" id="out-time" required>
                    </div>
                    <div>
                        <button type="submit" class="primary">Save Record</button>
                    </div>
                </form>
            </section>

            <!-- 2. Summary -->
            <section class="section-purple">
                <h2 style="margin:0 0 12px 0; font-size:1.15rem; color:#6b21a8;">Summary for <span id="month-display" style="font-weight:800; color:#5b21b6;"></span></h2>
                <div class="summary-grid">
                    <div class="summary-card">
                        <span class="summary-label">Today's Shift:</span>
                        <span id="display-shift" class="summary-value" style="color:#0ea5a0;">-- / --</span>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Total Hours Logged Today:</span>
                        <span id="display-daily-hours" class="summary-value" style="color:#16a34a;">0.00 Hours</span>
                    </div>
                    <div class="summary-card total">
                        <span class="summary-label">Total Monthly Hours:</span>
                        <span id="display-monthly-hours" class="summary-value" style="font-size:1.6rem; color:#5b21b6;">0.00 Hrs</span>
                    </div>
                </div>
                <div style="margin-top:12px; border-top:1px solid rgba(124,58,237,0.06); padding-top:12px;">
                    <button id="generate-report-btn" class="primary" style="background:#0b7a66;">Generate Monthly PDF Report (Print View)</button>
                </div>
            </section>

            <!-- 3. History -->
            <section class="section-teal">
                <h2 style="margin:0 0 12px 0; font-size:1.15rem; color:#065f46;">Monthly Shifts History</h2>
                <div id="shifts-history" class="history-wrapper">
                    <!-- dynamic -->
                </div>
            </section>
        </div>
    </div>

    <!-- JS (unchanged logic, small tweaks for status class usage and 'hidden') -->
    <script type="module">
        // DOM Elements
        const statusMessageEl = document.getElementById('status-message');
        const contentEl = document.getElementById('content');
        const timeForm = document.getElementById('time-form');
        const recordDateInput = document.getElementById('record-date');
        const inTimeInput = document.getElementById('in-time');
        const outTimeInput = document.getElementById('out-time');
        const displayShiftEl = document.getElementById('display-shift');
        const displayDailyHoursEl = document.getElementById('display-daily-hours');
        const displayMonthlyHoursEl = document.getElementById('display-monthly-hours');
        const monthDisplayEl = document.getElementById('month-display');
        const generateReportBtn = document.getElementById('generate-report-btn');

        // Local Storage Keys
        const LS_RECORDS_KEY = 'employee_time_records';

        // --- Utility Functions ---
        function setStatus(message, isError = false) {
            statusMessageEl.textContent = message;
            statusMessageEl.className = isError ? 'status error text-center' : 'status text-center';
        }

        function loadFromLS(key, defaultValue = {}) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : defaultValue;
            } catch (e) {
                console.error("Error loading from localStorage:", key, e);
                return defaultValue;
            }
        }

        function saveToLS(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (e) {
                console.error("Error saving to localStorage:", key, e);
                setStatus("Error: Local storage limit reached!", true);
            }
        }

        function formatTime12Hour(time24) {
            if (!time24) return '--:--';
            try {
                const [hours, minutes] = time24.split(':').map(Number);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                const displayHours = hours % 12 || 12;
                const displayMinutes = String(minutes).padStart(2, '0');
                return `${displayHours}:${displayMinutes} ${ampm}`;
            } catch (e) {
                console.error("Error formatting time:", e);
                return time24;
            }
        }

        function calculateWorkDuration(startTime, endTime) {
            if (!startTime || !endTime) return { 
                formatted: "0:00",
                floatHours: "0.00",
                durationMinutes: 0 
            };

            try {
                const [startHour, startMinute] = startTime.split(':').map(Number);
                const [endHour, endMinute] = endTime.split(':').map(Number);

                let startTotalMinutes = startHour * 60 + startMinute;
                let endTotalMinutes = endHour * 60 + endMinute;

                if (endTotalMinutes < startTotalMinutes) {
                    endTotalMinutes += 24 * 60;
                }

                const durationMinutes = endTotalMinutes - startTotalMinutes;
                const hours = Math.floor(durationMinutes / 60);
                const minutes = durationMinutes % 60;

                // Format as "HH:MM"
                const formatted = `${hours}:${String(minutes).padStart(2, '0')}`;
                
                return {
                    formatted: formatted,
                    floatHours: (durationMinutes / 60).toFixed(2),
                    durationMinutes: durationMinutes
                };
            } catch (e) {
                console.error("Error calculating duration:", e);
                return { formatted: "0:00", floatHours: "0.00", durationMinutes: 0 };
            }
        }

        function getCustomMonthRange() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth(); // 0-11
            const day = now.getDate();

            // If current date is 1-20, show previous month's 20th to current date
            // If current date is 21-31, show current month's 20th to next month's 20th
            let startDate, endDate;
            
            if (day <= 20) {
                // Show from previous month's 20th
                startDate = new Date(year, month - 1, 20);
                endDate = new Date(year, month, 20);
            } else {
                // Show from current month's 20th
                startDate = new Date(year, month, 20);
                endDate = new Date(year, month + 1, 20);
            }

            return {
                start: startDate,
                end: endDate,
                displayMonth: day <= 20 ? startDate : endDate
            };
        }

        function calculateMonthlyTotal(records) {
            const dateRange = getCustomMonthRange();
            let totalMinutes = 0;

            // Convert all records to array and filter by date range
            Object.values(records).flat().forEach(record => {
                const recordDate = new Date(record.date);
                if (recordDate >= dateRange.start && recordDate <= dateRange.end) {
                    const dur = calculateWorkDuration(record.inTime, record.outTime);
                    totalMinutes += dur.durationMinutes || 0;
                }
            });

            return totalMinutes;
        }

        function renderMonthlyShifts(records) {
            const shiftsHistoryEl = document.getElementById('shifts-history');
            const dateRange = getCustomMonthRange();

            // Gather all records within date range
            const filteredRecords = Object.values(records)
                .flat()
                .filter(record => {
                    const recordDate = new Date(record.date);
                    return recordDate >= dateRange.start && recordDate <= dateRange.end;
                })
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filteredRecords.length === 0) {
                shiftsHistoryEl.innerHTML = '<p style="padding:18px; text-align:center; color:#0f766e; background:#ecfeff; border-radius:8px;">No shift entries recorded for this period yet. Use the form above to add an entry!</p>';
                return;
            }

            // Rest of your existing table generation code
            let html = `
                <div style="overflow-x:auto; border-radius:10px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>In Time</th>
                                <th>Out Time</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filteredRecords.forEach(record => {
                const dateObj = new Date(record.date.replace(/-/g, '/'));
                const dateDisplay = dateObj.toLocaleString('en-US', { month: 'short', day: '2-digit' });
                const duration = calculateWorkDuration(record.inTime, record.outTime);
                
                html += `
                    <tr>
                        <td>${dateDisplay}</td>
                        <td class="time-in">${record.inTime || '--:--'}</td>
                        <td class="time-out">${record.outTime || '--:--'}</td>
                        <td class="duration">${duration.formatted} hrs</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            shiftsHistoryEl.innerHTML = html;
        }

        function updateUI() {
            const now = new Date();
            const todayDateKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            const records = loadFromLS(LS_RECORDS_KEY, {});
            const monthlyRecords = records[monthKey] || [];
            const todayRecord = monthlyRecords.find(r => r.date === todayDateKey) || {};

            if (!recordDateInput.value) recordDateInput.value = todayDateKey;
            inTimeInput.value = todayRecord.inTime || '';
            outTimeInput.value = todayRecord.outTime || '';

            const dateRange = getCustomMonthRange();
            monthDisplayEl.textContent = `${dateRange.start.toLocaleString('en-US', { month: 'long' })} 20 - ${dateRange.end.toLocaleString('en-US', { month: 'long' })} 20, ${dateRange.end.getFullYear()}`;

            const dailyDuration = calculateWorkDuration(todayRecord.inTime, todayRecord.outTime);
            displayShiftEl.textContent = (todayRecord.inTime && todayRecord.outTime) ? `${todayRecord.inTime} - ${todayRecord.outTime}` : '-- / --';
            displayDailyHoursEl.textContent = `${dailyDuration.formatted} Hours`;

            const monthlyTotalMinutes = calculateMonthlyTotal(records);
            const monthlyHours = Math.floor(monthlyTotalMinutes / 60);
            const monthlyMinutes = monthlyTotalMinutes % 60;
            const monthlyFormatted = `${monthlyHours}:${String(monthlyMinutes).padStart(2, '0')}`;
            displayMonthlyHoursEl.textContent = `${monthlyFormatted} Hrs`;

            renderMonthlyShifts(records);

            setStatus("Ready. Data is stored locally in your browser.");
            contentEl.classList.remove('hidden');
        }

        timeForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const inputDateString = recordDateInput.value;
            const inTime = inTimeInput.value;
            const outTime = outTimeInput.value;

            if (!inputDateString || !inTime || !outTime) {
                setStatus("Date, In-Time, and Out-Time are all required.", true);
                return;
            }
            
            const dateKey = inputDateString;
            const [year, month] = dateKey.split('-');
            const monthKey = `${year}-${month}`;

            const dailyDuration = calculateWorkDuration(inTime, outTime);
            
            if (dailyDuration.durationMinutes < 0) {
                 setStatus("Out-Time must be after In-Time. (It can cross midnight, e.g., 23:00 to 07:00).", true);
                 return;
            }
            
            const newRecord = {
                date: dateKey,
                inTime: inTime,
                outTime: outTime,
                durationMinutes: dailyDuration.durationMinutes
            };

            const allRecords = loadFromLS(LS_RECORDS_KEY, {});
            const monthlyRecords = allRecords[monthKey] || [];
            const existingIndex = monthlyRecords.findIndex(r => r.date === dateKey);

            if (existingIndex > -1) {
                monthlyRecords[existingIndex] = newRecord;
            } else {
                monthlyRecords.push(newRecord);
            }
            
            allRecords[monthKey] = monthlyRecords;
            saveToLS(LS_RECORDS_KEY, allRecords);

            updateUI();
            setStatus(`Daily record for ${dateKey} saved/updated!`, false);
        });

        generateReportBtn.addEventListener('click', () => {
            window.print();
        });

        window.onload = updateUI;
    </script>
</body>
</html>
